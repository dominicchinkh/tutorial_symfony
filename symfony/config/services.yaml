# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

    # Once defined, you can reference this parameter value from any other configuration file using 
    # a special syntax: wrap the parameter name in two % (e.g. %app.admin_email%):

    # The parameter name is an arbitrary string (the 'app.' prefix is recommended
    # to better differentiate your parameters from Symfony parameters).
    app.admin_email: 'something@example.com'

    # boolean parameters
    app.enable_v2_protocol: true

    # array/collection parameters
    app.supported_locales: ['en', 'es', 'fr']

    # binary content parameters (encode the contents with base64_encode())
    app.some_parameter: !!binary VGhpcyBpcyBhIEJlbGwgY2hhciAH

    # PHP constants as parameter values
    app.some_constant: !php/const PHP_INT_MAX
    app.another_constant: !php/const App\Constant\AppConstant::PULL_REQUEST_STATE_START

    # Enum case as parameter values
    app.some_enum: !php/enum App\Enum\PullRequestState::Merged

    # This value will be overwritten in config/services_dev.yaml
    app.parameter:
        value: 'in config/services.yaml'

    # If your application tries to use an env var that hasn't been defined, you'll see an exception. 
    # You can prevent that by defining a default value for the env var. To do so, define a parameter 
    # with the same name as the env var using this syntax:

    # if the SECRET env var value is not defined anywhere, Symfony uses this value
    env(SECRET): 'some_secret'

    # These environment variables are loaded via a service whose class implements EnvVarLoaderInterface
    # App/Service/JsonEnvVarLoader

    # Inspect with
    #   php bin/console debug:container --env-vars

    app.custom_env: '%env(JSON_APP_ENV)%'
    app.custom_debug_mode: '%env(JSON_APP_DEBUG)%'

    #---------------------------------
    # Environment Variable Processors

    # Env vars can only be strings and your application may need other data types (integer, boolean, etc.). 
    # Symfony solves this problem with "env var processors", which transform the original contents of the 
    # given environment variables

    # Check out https://symfony.com/doc/current/configuration/env_var_processors.html for all built-In environment 
    # variable processors
    
    # The following example uses the integer processor to turn the value of the HTTP_PORT env var into an 
    # integer:
    http_port: '%env(int:HTTP_PORT)%'

    # Decodes the content of FOO, which is a base64 encoded string
    # echo 'dominic' | base64 -w 0
    env(JWT_PRIVATE_KEY_BASE64): ZG9taW5pYwo=
    jwt_private_key: '%env(base64:JWT_PRIVATE_KEY_BASE64)%'
    
    # Decodes the content of ALLOWED_LANGUAGES, which is a JSON encoded string:
    env(ALLOWED_LANGUAGES_1): '["en","de","es"]'
    app_allowed_languages_1: '%env(json:ALLOWED_LANGUAGES_1)%'

    # If the content of FOO includes container parameters (with the syntax %parameter_name%), it replaces 
    # the parameters by their values:
    sentry_host: '10.0.0.1'
    env(SENTRY_DSN): 'http://%sentry_host%/project'
    dsn: '%env(resolve:SENTRY_DSN)%'

    # Decodes the content of ALLOWED_LANGUAGES, which is a CSV-encoded string and returns an array. An empty 
    # string will result in an empty array:
    env(ALLOWED_LANGUAGES_2): "en,de,es"
    app_allowed_languages_2: '%env(csv:ALLOWED_LANGUAGES_2)%'

    # Randomly shuffles values of the REDIS_NODES env var, which must be an array
    env(REDIS_NODES): "127.0.0.1:6380,127.0.0.1:6381"
    redis_nodes_list: [null, "%env(shuffle:csv:REDIS_NODES)%"]

    # Returns the contents of a file whose path is the value of the FOO env var:
    env(AUTH_FILE): '%kernel.project_dir%/config/env_var_processor/env.yaml'
    auth_file: '%env(file:AUTH_FILE)%'

    # require() the PHP file whose path is the value of the PHP_FILE env var and return the value returned 
    # from it.
    env(PHP_FILE): '%kernel.project_dir%/config/env_var_processor/auth.php'
    php_file: '%env(require:PHP_FILE)%'

    # Trims the content of FOO env var, removing whitespaces from the beginning and end of the string. This 
    # is especially useful in combination with the file processor, as it'll remove newlines at the end of a file.
    env(TRIMMED_ENV_FILE): '%kernel.project_dir%/config/env_var_processor/env.yaml'
    trimmed_env: '%env(trim:file:TRIMMED_ENV_FILE)%'

    # Retrieves the value associated with the key FOO from the array whose contents are stored in the BAR env var:
    env(SECRETS_FILE): '%kernel.project_dir%/config/env_var_processor/secret.json'
    database_password: '%env(key:database_password:json:file:SECRETS_FILE)%'
    # if SECRETS_FILE contents are: {"database_password": "secret"} it returns "secret"

    # Retrieves the value of the parameter fallback_param when the BAR env var is not available:
    raw_key: '%env(JWT_PRIVATE_KEY_BASE64)%'
    private_key: '%env(default:raw_key:file:PRIVATE_KEY)%'

    # Parses an absolute URL and returns its components as an associative array.
    env(POSTGRESQL_DATABASE_URL): "postgresql://db_user:db_password@127.0.0.1:5432/db_name?serverVersion=12.19&charset=utf8"
    database_parts: '%env(url:POSTGRESQL_DATABASE_URL)%'

    # Parses the query string part of the given URL and returns its components as an associative array.
    database_queries: '%env(query_string:POSTGRESQL_DATABASE_URL)%'

    # Tries to convert an environment variable to an actual \PullRequestState value
    env(Review): 'review'
    review_enum: '%env(enum:App\Enum\PullRequestState:Review)%'

    # My customer env var processor
    # Refer to App\DependencyInjection/LowercasingEnvVarProcessor
    lower_cased_jwt_private_key: '%env(lowercase:JWT_PRIVATE_KEY_BASE64)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

        # If you inject the same parameters over and over again, use the services._defaults.bind option 
        # instead. The arguments defined in that option are injected automatically whenever a service 
        # constructor or controller action defines an argument with that exact name
        
        bind:
            $projectDir: '%kernel.project_dir%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Dto/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Used by the microkernel compiler pass in index.php (setPublic / findTaggedServiceIds)
    app.some_private_service:
        class: App\Service\SomePrivateService
        public: false

    App\Service\TaggedServiceOne:
        tags:
            - { name: some_tag }

    App\Service\TaggedServiceTwo:
        tags:
            - { name: some_tag, priority: 10 }

imports:
    - { resource: 'legacy_config.php' }

    # `glob` expressions are also supported to load multiple files
    - { resource: 'other/*.yaml' }

    # `ignore_errors: not_found` silently discards errors if the loaded file doesn't exist
    - { resource: 'my_config_file.yaml', ignore_errors: not_found }
    
    # `ignore_errors: true` silently discards all errors (including invalid code and not found)
    - { resource: 'my_other_config_file.yaml', ignore_errors: true }

    # Exclude specific files when using glob patterns
    - { resource: 'services/*.yaml', exclude: ['services/legacy_*.yaml'] }
