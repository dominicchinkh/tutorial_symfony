twig:
    globals:
        ga_tracking: 'UA-xxxxx-x'

        # Twig global variables can also reference services from the service container.
        # The value is the service's id prefixed with '@'

        # Note: The main drawback is that these services are not loaded lazily
        csrf_token: '@App\Generator\CsrfToken'

    # Template Namespaces
    # Each path is defined as a key: value pair where the key is the template
    # directory and the value is the Twig namespace.
    # Directories are relative to the project root dir (but you can also use
    # absolute directories).
    #
    # Without a namespace (~), Symfony looks in these paths first, then falls
    # back to templates/. With a namespace, use @namespace/template.html.twig
    # (e.g. @email/layout.html.twig, @admin/layout.html.twig).
    #
    # A single Twig namespace can be associated with more than one template
    # directory. In that case, the order in which paths are added is important
    # because Twig will start looking for templates from the first defined path.
    paths:
        'email/default/templates': 'email'
        'backend/templates': 'admin'
